title: AI Project Security Baseline - Transparency and Explainability
metadata:
  id: aips-baseline-te
  type: ControlCatalog
  gemara-version: v1.0.0
  description: Transparency and Explainability controls from the Open Source AI Project Governance and Security Baseline.
  draft: false
  parent-id: aips-baseline
  domain: Transparency and Explainability
  author:
    id: ibm-ai-baseline-authors
    name: IBM AI Baseline Authors
    type: Human
groups:
  - id: TE
    title: Transparency and Explainability
    description: Controls for transparency and explainability.
controls:
  - id: AIGS-TE-01
    title: Explainability
    objective: Where feasible, the project MUST provide explanations for design decisions that affect project performance and security.
    group: TE
    assessment-requirements:
      - id: AIGS-TE-01.01
        text: Explanations for design decisions affecting performance MUST be provided (where feasible)
        applicability:
          - maturity-1
      - id: AIGS-TE-01.02
        text: Explanations for design decisions affecting security MUST be provided (where feasible)
        applicability:
          - maturity-1
  - id: AIGS-TE-02
    title: System Documentation
    objective: Project contributors MUST maintain clear and comprehensive documentation for the AI system, including its intended use, limitations, and potential risks.
    group: TE
    assessment-requirements:
      - id: AIGS-TE-02.01
        text: Documentation for intended use MUST be maintained
        applicability:
          - maturity-1
      - id: AIGS-TE-02.02
        text: Documentation for limitations MUST be maintained
        applicability:
          - maturity-1
      - id: AIGS-TE-02.03
        text: Documentation for potential risks MUST be maintained
        applicability:
          - maturity-1
  - id: AIGS-TE-03
    title: Residual Risk Documentation
    objective: The project MUST document residual risks and known limitations of safeguards.
    group: TE
    assessment-requirements:
      - id: AIGS-TE-03.01
        text: Residual risks MUST be documented
        applicability:
          - maturity-1
          - maturity-2
          - maturity-3
      - id: AIGS-TE-03.02
        text: Known safeguard limitations MUST be documented
        applicability:
          - maturity-1
          - maturity-2
          - maturity-3
  - id: AIGS-TE-04
    title: Security Incident Reporting
    objective: The project MUST maintain a public record of safety and security incidents and ex post mitigations.
    group: TE
    assessment-requirements:
      - id: AIGS-TE-04.01
        text: Public record of incidents MUST be maintained
        applicability:
          - maturity-1
          - maturity-2
          - maturity-3
      - id: AIGS-TE-04.02
        text: Safety incidents MUST be recorded
        applicability:
          - maturity-1
          - maturity-2
          - maturity-3
      - id: AIGS-TE-04.03
        text: Security incidents MUST be recorded
        applicability:
          - maturity-1
          - maturity-2
          - maturity-3
      - id: AIGS-TE-04.04
        text: Ex post mitigations MUST be recorded
        applicability:
          - maturity-1
          - maturity-2
          - maturity-3
