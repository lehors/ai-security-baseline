title: AI Project Security Baseline - Deployment
metadata:
  id: aips-baseline-dp
  type: ControlCatalog
  gemara-version: v1.0.0
  description: Deployment controls from the Open Source AI Project Governance and Security Baseline.
  draft: false
  parent-id: aips-baseline
  domain: Deployment
  author:
    id: ibm-ai-baseline-authors
    name: IBM AI Baseline Authors
    type: Human
groups:
  - id: DP
    title: Deployment
    description: Controls for deployment.
controls:
  - id: AIGS-DP-01
    title: Guardrails Implementation
    objective: The project MUST implement guardrails to mitigate identified risks, and at a minimum, implement guardrails to mitigate against prompt injection attacks (input).
    group: DP
    assessment-requirements:
      - id: AIGS-DP-01.01
        text: Guardrails MUST be implemented to mitigate identified risks
        applicability:
          - maturity-1
          - maturity-2
          - maturity-3
      - id: AIGS-DP-01.02
        text: Guardrails MUST mitigate against prompt injection attacks (at minimum)
        applicability:
          - maturity-1
          - maturity-2
          - maturity-3
  - id: AIGS-DP-02
    title: Vulnerability Disclosure Mechanism
    objective: The project MUST have a defined communication channel or mechanism through which vulnerabilities and other security-related information may be disclosed to the project contributors and maintainers.
    group: DP
    assessment-requirements:
      - id: AIGS-DP-02.01
        text: Communication channel for vulnerability disclosure MUST be defined
        applicability:
          - maturity-1
          - maturity-2
          - maturity-3
      - id: AIGS-DP-02.02
        text: Mechanism for security-related information disclosure MUST be defined
        applicability:
          - maturity-1
          - maturity-2
          - maturity-3
  - id: AIGS-DP-03
    title: Insecure Output Handling
    objective: The project MUST validate and sanitize model outputs to prevent downstream vulnerabilities.
    group: DP
    assessment-requirements:
      - id: AIGS-DP-03.01
        text: Model output validation MUST be implemented
        applicability:
          - maturity-1
          - maturity-2
          - maturity-3
      - id: AIGS-DP-03.02
        text: Model output sanitization MUST be implemented
        applicability:
          - maturity-1
          - maturity-2
          - maturity-3
  - id: AIGS-DP-04
    title: Deployment Infrastructure
    objective: Access to models, tools and tool calling functionality, and general deployment scaffolding or infrastructure MUST follow least-privilege principles.
    group: DP
    assessment-requirements:
      - id: AIGS-DP-04.01
        text: Access to models MUST follow least-privilege principles
        applicability:
          - maturity-2
          - maturity-3
      - id: AIGS-DP-04.02
        text: Access to tools and tool calling MUST follow least-privilege principles
        applicability:
          - maturity-2
          - maturity-3
      - id: AIGS-DP-04.03
        text: Access to deployment infrastructure MUST follow least-privilege principles
        applicability:
          - maturity-2
          - maturity-3
  - id: AIGS-DP-05
    title: Logging and Monitoring
    objective: The project MUST implement logging and monitoring for deployment environments, including tool use, to detect misuse or anomalies.
    group: DP
    assessment-requirements:
      - id: AIGS-DP-05.01
        text: Logging for deployment environments MUST be implemented
        applicability:
          - maturity-2
          - maturity-3
      - id: AIGS-DP-05.02
        text: Monitoring for deployment environments MUST be implemented
        applicability:
          - maturity-2
          - maturity-3
      - id: AIGS-DP-05.03
        text: Tool use logging MUST be implemented
        applicability:
          - maturity-2
          - maturity-3
      - id: AIGS-DP-05.04
        text: Anomaly detection MUST be implemented
        applicability:
          - maturity-2
          - maturity-3
  - id: AIGS-DP-06
    title: Incident Response Procedures
    objective: The project MUST define procedures for responding to security incidents involving the AI project in a timely manner.
    group: DP
    assessment-requirements:
      - id: AIGS-DP-06.01
        text: Incident response procedures MUST be defined
        applicability:
          - maturity-2
          - maturity-3
      - id: AIGS-DP-06.02
        text: Procedures MUST ensure timely response to incidents
        applicability:
          - maturity-2
          - maturity-3
  - id: AIGS-DP-07
    title: Project Maintenance
    objective: The project MUST document processes for releasing model updates and security patches.
    group: DP
    assessment-requirements:
      - id: AIGS-DP-07.01
        text: Model update release processes MUST be documented
        applicability:
          - maturity-2
          - maturity-3
      - id: AIGS-DP-07.02
        text: Security patch release processes MUST be documented
        applicability:
          - maturity-2
          - maturity-3
  - id: AIGS-DP-08
    title: Runtime Safeguards
    objective: Deployment environments MUST include runtime safeguards for detecting and mitigating malicious inputs and outputs and unexpected or unauthorized system-level behavior.
    group: DP
    assessment-requirements:
      - id: AIGS-DP-08.01
        text: Malicious input detection MUST be implemented
        applicability:
          - maturity-3
      - id: AIGS-DP-08.02
        text: Malicious output detection MUST be implemented
        applicability:
          - maturity-3
      - id: AIGS-DP-08.03
        text: Malicious input mitigation MUST be implemented
        applicability:
          - maturity-3
      - id: AIGS-DP-08.04
        text: Malicious output mitigation MUST be implemented
        applicability:
          - maturity-3
      - id: AIGS-DP-08.05
        text: Unexpected behavior detection MUST be implemented
        applicability:
          - maturity-3
      - id: AIGS-DP-08.06
        text: Unauthorized system-level behavior detection MUST be implemented
        applicability:
          - maturity-3
  - id: AIGS-DP-09
    title: Kill Switch
    objective: The project MUST implement a security mechanism designed to immediately halt, disable, or contain an AI project if it is believed to behave in dangerous or unpredictable ways causing harm.
    group: DP
    assessment-requirements:
      - id: AIGS-DP-09.01
        text: Security mechanism MUST be implemented to halt/disable the AI project
        applicability:
          - maturity-3
      - id: AIGS-DP-09.02
        text: Mechanism MUST be able to contain the AI project
        applicability:
          - maturity-3
      - id: AIGS-DP-09.03
        text: Mechanism MUST enable immediate action
        applicability:
          - maturity-3
